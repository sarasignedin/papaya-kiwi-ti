[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "papaya-kiwi-ti"
version = "0.1.0"
description = "AI-native threat intelligence toolkit for collection, enrichment, ATT&CK mapping, and plain-English reporting."
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.10"
authors = [
    {name = "Sara", email = "sara@papayakiwi.com"},
]
keywords = ["threat-intelligence", "cybersecurity", "mitre-attack", "osint", "ioc", "mdr"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Intended Audience :: Information Technology",
    "Topic :: Security",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
]

dependencies = [
    "requests>=2.28.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "pytest-cov>=4.0",
    "ruff>=0.1.0",
    "mypy>=1.0",
]
all = [
    "shodan>=1.28.0",
    "stix2>=3.0.0",
]

[project.urls]
Homepage = "https://github.com/papayakiwi/papaya-kiwi-ti"
Documentation = "https://github.com/papayakiwi/papaya-kiwi-ti#readme"
Repository = "https://github.com/papayakiwi/papaya-kiwi-ti"
Issues = "https://github.com/papayakiwi/papaya-kiwi-ti/issues"

[tool.setuptools.packages.find]
include = ["papaya_kiwi_ti*"]

[tool.ruff]
target-version = "py310"
line-length = 120

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.mypy]
python_version = "3.10"
warn_return_any = true
warn_unused_configs = true
